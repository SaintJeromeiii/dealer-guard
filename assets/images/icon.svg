<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#0a2540"/>

  <!-- Shield body -->
  <path d="M256 80 L390 130 L390 270 Q390 360 256 430 Q122 360 122 270 L122 130 Z"
